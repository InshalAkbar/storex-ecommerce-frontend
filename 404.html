<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found — StoreX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/storex.css">
</head>

<body>

<section class="storex-404">

    <div class="error-glow error-glow-one"></div>
    <div class="error-glow error-glow-two"></div>


    <div class="container">

        <div class="error-content">

            <a href="index.html" class="error-logo">
                STORE<span>X</span>
            </a>


            <div class="error-code">
                404
            </div>


            <span class="section-label">
                PAGE NOT FOUND
            </span>

            <h1 class="error-title">
                Lost in
                <br>
                <span>the void.</span>
            </h1>

            <p class="error-description">
                The page you're looking for doesn't exist
                or has been moved somewhere else.
            </p>


            <div class="error-actions">

                <a href="index.html" class="btn-storex">
                    Back to Home
                    <span>
                        →
                    </span>
                </a>

                <a href="shop.html" class="error-secondary-link">
                    Browse Shop
                </a>

            </div>

        </div>

    </div>

</section>

</body>
</html>
