<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="static-token">

    <title>Admin Login — StoreX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/storex.css">

    
</head>

<body class="storex-auth-body">

    <a href="../index.html" class="auth-back-btn" onclick="event.preventDefault(); window.history.length > 1 ? window.history.back() : window.location.href='../index.html';">
        ← Back
    </a>

    

<section class="storex-auth-split">

    <div class="auth-bg-grid">
        <img src="../images/categories/technology.jpg" alt="">
        <img src="../images/categories/fashion.jpg" alt="">
        <img src="../images/categories/lifestyle.jpg" alt="">
        <img src="../images/products/aero-wireless-headphones.png" alt="">
        <img src="../images/products/nova-essential-jacket.png" alt="">
        <img src="../images/products/vertex-smart-lamp.png" alt="">
        <img src="../images/products/studio-leather-bag.png" alt="">
        <img src="../images/categories/technology.jpg" alt="">
        <img src="../images/categories/fashion.jpg" alt="">
        <img src="../images/categories/lifestyle.jpg" alt="">
        <img src="../images/products/aero-wireless-headphones.png" alt="">
        <img src="../images/products/nova-essential-jacket.png" alt="">
    </div>

    <div class="auth-bg-overlay"></div>

    <div class="auth-center-wrap">

        <div class="auth-card">

            <a href="../index.html" class="auth-card-logo">
                STORE<span>X</span>
            </a>

            <div class="auth-card-header">
                <span class="section-label">ADMIN ACCESS</span>
                <h2 class="auth-card-title">Admin <span>Panel.</span></h2>
                <p class="auth-card-subtitle">Authorized personnel only. Enter credentials to continue.</p>
            </div>

            

            <form class="auth-form" data-static="1" data-action="admin.login.post" data-method="POST">
                

                <div class="auth-field">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" name="email" value="" placeholder="admin@storex.com" required autofocus>
                    
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <div class="auth-password-wrap">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="auth-password-toggle" data-target="password">👁</button>
                    </div>
                    
                </div>

                <div class="auth-row">
                    <label class="auth-checkbox">
                        <input type="checkbox" name="remember" id="remember_me">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="auth-submit">
                    Access Admin Panel
                    <span>→</span>
                </button>
            </form>

            <div class="auth-form-footer" style="justify-content: center;">
                <a href="../index.html" style="color: #94a3b8;">← Back to StoreX</a>
            </div>

        </div>

    </div>

</section>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>window.csrfToken = "static-token";</script>
    <script src="../js/storex-data.js"></script>
    <script src="../js/storex-static.js"></script>
    <script src="../js/storex.js"></script>

    

</body>
</html>
