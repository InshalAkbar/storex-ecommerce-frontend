<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="static-token">

    <title>Register — StoreX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/storex.css">

    
</head>

<body class="storex-auth-body">

    <a href="index.html" class="auth-back-btn" onclick="event.preventDefault(); window.history.length > 1 ? window.history.back() : window.location.href='index.html';">
        ← Back
    </a>

    

<section class="storex-auth-split">

    <div class="auth-bg-grid">

        <img src="images/products/aero-wireless-headphones.png" alt="">
        <img src="images/products/nova-essential-jacket.png" alt="">
        <img src="images/products/vertex-smart-lamp.png" alt="">
        <img src="images/products/studio-leather-bag.png" alt="">
        <img src="images/categories/technology.jpg" alt="">
        <img src="images/categories/fashion.jpg" alt="">
        <img src="images/categories/lifestyle.jpg" alt="">
        <img src="images/products/aero-wireless-headphones.png" alt="">
        <img src="images/products/nova-essential-jacket.png" alt="">
        <img src="images/products/vertex-smart-lamp.png" alt="">
        <img src="images/products/studio-leather-bag.png" alt="">
        <img src="images/categories/technology.jpg" alt="">

    </div>

    <div class="auth-bg-overlay"></div>


    <div class="auth-center-wrap">

        <div class="auth-card">

            <a href="index.html" class="auth-card-logo">
                STORE<span>X</span>
            </a>


            <div class="auth-card-header">

                <span class="section-label">CREATE ACCOUNT</span>

                <h2 class="auth-card-title">
                    Get <span>started.</span>
                </h2>

                <p class="auth-card-subtitle">
                    It only takes a minute to join.
                </p>

            </div>


            
            


            <form class="auth-form" data-static="1" data-action="register.html" data-method="POST">

                


                <div class="auth-field">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value=""
                        placeholder="John Doe"
                        required
                        autofocus
                        autocomplete="name"
                    >

                    

                </div>


                <div class="auth-field">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value=""
                        placeholder="you@example.com"
                        required
                        autocomplete="username"
                    >

                    

                </div>


                <div class="auth-field">

                    <label for="password">Password</label>

                    <div class="auth-password-wrap">

                        <input
                            type="password"
                            id="regPassword"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="auth-password-toggle"
                            data-target="regPassword"
                        >
                            👁
                        </button>

                    </div>

                    <div class="auth-strength">

                        <div class="auth-strength-bar" id="strengthBar"></div>

                    </div>

                    <small class="auth-field-hint">
                        Must be at least 8 characters
                    </small>

                    

                </div>


                <div class="auth-field">

                    <label for="password_confirmation">Confirm Password</label>

                    <div class="auth-password-wrap">

                        <input
                            type="password"
                            id="password_confirmation"
                            name="password_confirmation"
                            placeholder="••••••••"
                            required
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="auth-password-toggle"
                            data-target="password_confirmation"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="auth-row">

                    <label class="auth-checkbox">

                        <input type="checkbox" id="agreeTerms" required>

                        <span>
                            I agree to the
                            <a href="about.html">Terms</a>
                            and
                            <a href="about.html">Privacy Policy</a>
                        </span>

                    </label>

                </div>


                <button type="submit" class="auth-submit">

                    Create Account

                    <span>→</span>

                </button>

            </form>


            <div class="auth-form-footer">

                <span>Already have an account?</span>

                <a href="login.html">Sign in →</a>

            </div>

        </div>

    </div>

</section>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>window.csrfToken = "static-token";</script>
    <script src="js/storex-data.js"></script>
    <script src="js/storex-static.js"></script>
    <script src="js/storex.js"></script>

    

</body>
</html>
